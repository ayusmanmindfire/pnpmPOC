service: aws-greeting-service
frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs22.x
  region: us-east-1
  memorySize: 128
  timeout: 10

functions:
  getGreeting:
    handler: src/main.handler
    events:
      - httpApi:
          path: /greet
          method: get

plugins:
  - serverless-offline
  - serverless-esbuild

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    platform: node
    target: node22
    tsconfig: ./tsconfig.app.json